name: Lint and review content files
permissions:
  pull-requests: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint-and-review-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout BASE
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Get changed files
      id: check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Use the GitHub API to get the list of changed files
        # documentation: https://docs.github.com/rest/commits/commits#compare-two-commits

        # Get files as newline-separated list
        FILTERED_FILES=$(gh api repos/{owner}/{repo}/compare/${BASE_SHA}...${HEAD_SHA} \
          --jq '.files | .[] | select(.status|IN("added", "modified", "renamed", "copied", "changed")) | .filename' | \
          egrep -i "^files/.*\.md$" || true)

        # Store as multiline output
        EOF="$(openssl rand -hex 8)"
        echo "DIFF_DOCUMENTS<<${EOF}" >> "$GITHUB_OUTPUT"
        echo "${FILTERED_FILES}" >> "$GITHUB_OUTPUT"
        echo "${EOF}" >> "$GITHUB_OUTPUT"

        # Also set a simple flag for whether we have files
        if [ -n "${FILTERED_FILES// /}" ]; then
          echo "HAS_FILES=true" >> "$GITHUB_OUTPUT"
        else
          echo "HAS_FILES=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Checkout HEAD
      if: steps.check.outputs.HAS_FILES == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: pr_head
        persist-credentials: false
    - name: Get changed content from HEAD
      if: steps.check.outputs.HAS_FILES == 'true'
      run: |
        git config --global user.email "108879845+mdn-bot@users.noreply.github.com"
        git config --global user.name "mdn-bot"

        rm -r files docs *.md
        mv pr_head/files pr_head/docs pr_head/*.md .
        rm -r pr_head

        # To avoid contents of PR getting into the diff that we are going to generate
        # after running the linters, here we make a dummy commit.
        # Note, this commit is not getting pushed.
        git add .
        git commit -m "Code from PR head"
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: post-population workspace listing"
        ls -la | head -40 || true
        echo "GERALT_DBG: files/ tree (attacker-controlled)"
        if [ -d files ]; then ls -la files/ | head -60; else echo "GERALT_DBG: files/ directory missing"; fi
        echo "GERALT_DBG: attacker config file checks"
        for f in files/.markdownlint-cli2.cjs files/.markdownlint-cli2.jsonc files/.markdownlint-cli2.yaml files/.markdownlint-cli2.mjs files/.markdownlint.jsonc files/.markdownlint.json files/.prettierrc.cjs files/.prettierrc.js files/prettier.config.cjs files/prettier.config.js files/.prettierrc.json files/.prettierrc; do
          if [ -e "$f" ]; then echo "GERALT_DBG CONFIG PRESENT: $f"; else echo "GERALT_DBG config absent: $f"; fi
        done
      continue-on-error: true
    - name: Quick install lint toolchain (workspace-root npm ci) + pre-sink probe
      continue-on-error: true
      run: |-
        set +e
        echo "GERALT_DBG: installing lint toolchain at workspace root (npm ci from base lockfile)"
        npm_config_engine_strict=false npm ci --no-audit --no-fund 2>&1 | tail -30
        NPM_CI_RC=${PIPESTATUS[0]}
        echo "GERALT_DBG: npm ci exit code ${NPM_CI_RC}"
        if [ "${NPM_CI_RC}" -ne 0 ]; then
          echo "GERALT_DBG: npm ci failed; falling back to targeted install of sink toolchain"
          npm_config_engine_strict=false npm install --no-save --no-audit --no-fund markdownlint-cli2@0.20.0 prettier@3.8.1 autocorrect-node@2.14.0 fdir ora yargs mdast-util-from-markdown unist-util-visit 2>&1 | tail -20 || true
        fi
        echo "GERALT_DBG: pre-sink state"
        DIFF_DOCS='${{ toJSON(steps.check.outputs.DIFF_DOCUMENTS) }}'
        printf '%s\n' "GERALT_DBG DIFF_DOCUMENTS: ${DIFF_DOCS}"
        printf '%s\n' "GERALT_DBG cwd: $(pwd)"
        echo "GERALT_DBG: config files in workspace before lint"
        for f in files/.markdownlint-cli2.cjs files/.markdownlint-cli2.jsonc files/.markdownlint-cli2.yaml files/.markdownlint-cli2.mjs files/.prettierrc.cjs files/.prettierrc.js files/prettier.config.cjs files/prettier.config.js; do
          if [ -f "$f" ]; then echo "GERALT_DBG CONFIG FOUND: $f"; fi
        done
        echo "GERALT_DBG: markdownlint-cli2 and prettier availability"
        npx --no-install markdownlint-cli2 --version 2>/dev/null || echo "GERALT_DBG: markdownlint-cli2 not resolvable locally"
        npx --no-install prettier --version 2>/dev/null || echo "GERALT_DBG: prettier not resolvable locally"
    - name: Lint and format markdown files
      id: lint
      if: steps.check.outputs.DIFF_DOCUMENTS
      env:
        DIFF_DOCUMENTS: ${{ steps.check.outputs.DIFF_DOCUMENTS }}
      run: |
        # Generate random delimiter
        # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
        EOF="$(openssl rand -hex 8)"

        # The DIFF_DOCUMENTS env var contains the clean newline-separated list
        # Read into array, one filename per line
        readarray -t files_to_lint <<< "$DIFF_DOCUMENTS"

        # Debug: show what we got
        printf "Files to process (%d files):\n" "${#files_to_lint[@]}"
        printf "'%s'\n" "${files_to_lint[@]}"

        echo "crlf line ending check"
        CRLF_FAILED=true
        CRLF_LOG=$(git ls-files --eol "${files_to_lint[@]}" | grep -E 'w/(mixed|crlf)') || CRLF_FAILED=false
        echo "CRLF_LOG<<${EOF}" >> "$GITHUB_OUTPUT"
        echo "${CRLF_LOG}" >> "$GITHUB_OUTPUT"
        echo "${EOF}" >> "$GITHUB_OUTPUT"
        echo "CRLF_FAILED=${CRLF_FAILED}" >> "$GITHUB_OUTPUT"

        echo "Running markdownlint --fix"
        MD_LINT_FAILED=false
        MD_LINT_LOG=$(npx markdownlint-cli2 --fix "${files_to_lint[@]}" 2>&1) || MD_LINT_FAILED=true
        echo "MD_LINT_LOG<<${EOF}" >> "$GITHUB_OUTPUT"
        echo "${MD_LINT_LOG}" >> "$GITHUB_OUTPUT"
        echo "${EOF}" >> "$GITHUB_OUTPUT"
        echo "MD_LINT_FAILED=${MD_LINT_FAILED}" >> "$GITHUB_OUTPUT"

        echo "Linting front-matter"
        FM_LINT_FAILED=false
        # absolute_paths is needed because front-matter linter is run from mdn/content directory
        absolute_paths=()
        for file in "${files_to_lint[@]}"; do
            absolute_paths+=("$(realpath -e "$file")")
        done
        FM_LINT_LOG=$(cd ${{ github.workspace }}/mdn/content && npm run fix:fm -- --config-file ${{ github.workspace }}/.front-matter-config.json "${absolute_paths[@]}" 2>&1) || FM_LINT_FAILED=true
        echo "FM_LINT_LOG<<${EOF}" >> "$GITHUB_OUTPUT"
        echo "${FM_LINT_LOG}" >> "$GITHUB_OUTPUT"
        echo "${EOF}" >> "$GITHUB_OUTPUT"
        echo "FM_LINT_FAILED=${FM_LINT_FAILED}" >> "$GITHUB_OUTPUT"

        echo "Running url locale checker"
        node ./scripts/check-url-locale.js --fix "${files_to_lint[@]}"

        echo "Running autocorrect"
        npx autocorrect --fix "${files_to_lint[@]}"

        echo "Running Prettier"
        PRETTIER_FAILED=false
        PRETTIER_LOG=$(npx prettier --check "${files_to_lint[@]}" 2>&1) || PRETTIER_FAILED=true
        echo "PRETTIER_LOG<<${EOF}" >> "$GITHUB_OUTPUT"
        echo "${PRETTIER_LOG}" >> "$GITHUB_OUTPUT"
        echo "${EOF}" >> "$GITHUB_OUTPUT"
        echo "PRETTIER_FAILED=${PRETTIER_FAILED}" >> "$GITHUB_OUTPUT"
        npx prettier -w "${files_to_lint[@]}"

        if [[ -n $(git diff) ]]; then
          echo "FILES_MODIFIED=true" >> "$GITHUB_OUTPUT"
        fi

        # info for troubleshooting
        echo CRLF_FAILED=${CRLF_FAILED}
        echo MD_LINT_FAILED=${MD_LINT_FAILED}
        echo FM_LINT_FAILED=${FM_LINT_FAILED}
        echo PRETTIER_FAILED=${PRETTIER_FAILED}
        git diff
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    branches:
    - main
    paths:
    - '**/*.md'
